<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Card</title>
    <link rel="stylesheet" href="otpCard.css">
</head>
<body class="page-background-color">
    <div class="OTP-card centre">
        <img src="human.png" alt="Human" style="width: 70%; ">
        <h1 style="margin-bottom: 15px;">Check your email</h1>
        <p style="margin: 0px auto 30px; width: 70%; font-size: 12px; text-align: center;">Enter the 6-digit code we just sent to amy.smith@zest.com to continue.</p>
        <input class="inputField" type="number" placeholder="Enter OTP" value="123456" required minlength="6" maxlength="6">
        <br>
        <button class="btn" type="submit">Continue</button>
    </div>
    
</body>
</html>
