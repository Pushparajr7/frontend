<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Number Card</title>
    <link rel="stylesheet" href="num_card.css">
</head>

<body class="page-background-color">
    <div class="num-card centre">
        <h1 style="margin-bottom: 15px;">📞</h1>
        <h1 style="margin-bottom: 15px;">Phone Number</h1>
        <p style="margin: 0px auto 30px; width: 70%; font-size: 12px; text-align: center;">Would you like a new
            OpenPhone number, or want to port your existing number over?</p>
        <br>
        <div class="btn-row-bg">
            <p style="display: inline; margin-right: 15px;">🎁</p>
            <p style="display: inline;">Brand New Number</p>
        </div>
        <div class="btn-row">
            <p style="display: inline; margin-right: 15px;">➡️</p>
            <p style="display: inline;">Brand New Number</p>
        </div>
        <p style="font-size: 10px; padding: 0px 15px;">If you choose to port your existing number, you will be given a temporary OpenPhone number to test things out
            with during the porting process.</p>
    </div>
</body>

</html>
