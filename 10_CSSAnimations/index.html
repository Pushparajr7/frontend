<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animations</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="container">
        <div class="card bouncing-card">
            <p class="cardtitle">Bouncing ball</p>
            <div class="ball"></div>
        </div>
        <div class="card loader-card">
            <p class="cardtitle">Loader</p>
            <div class="spacer"></div>
            <div class="loader"></div>
        </div>
        <div class="card animated-btn-card">
            <p class="cardtitle">Animated button</p>
            <div class="spacer"></div>
            <button class="animated-button">Submit</button>
        </div>
    </div>
</body>
</html>
